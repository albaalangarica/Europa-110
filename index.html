<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>EUROPA 110</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --brand: #1E7787;
      --brand-ink: #155B68;
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --surface-2: #F1F2F1;
      --text: #17191A;
      --text-2: #666B6E;
      --text-3: #94999B;
      --line: #E5E7E6;
      --line-2: #D9DCDB;
      --danger: #A23B3B;
      --radius: 13px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        Geist,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }

    a {
      color: var(--brand);
      text-decoration: none;
    }

    /* LOGIN */

    .login-view {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        calc(28px + var(--safe-top))
        22px
        calc(28px + var(--safe-bottom));
      background: var(--bg);
    }

    .login-shell {
      width: min(100%, 360px);
    }

    .login-mark {
      width: 58px;
      height: 58px;
      display: block;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    .login-title {
      margin: 0;
      text-align: center;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: -.035em;
      font-weight: 720;
    }

    .login-subtitle {
      margin: 7px 0 30px;
      text-align: center;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-size: 12px;
      font-weight: 650;
      color: #4E5355;
    }

    .field input,
    .field select {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: #FFF;
      color: var(--text);
      outline: none;
      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(30,119,135,.10);
    }

    .login-submit {
      height: 50px;
      margin-top: 2px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #FFF;
      font-weight: 700;
      cursor: pointer;
    }

    .login-submit:active {
      background: var(--brand-ink);
      transform: translateY(1px);
    }

    .login-submit:disabled {
      opacity: .6;
    }

    .guest-link {
      display: block;
      margin-top: 14px;
      text-align: center;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 550;
      text-decoration: none;
    }

    .guest-link:hover,
    .guest-link:focus-visible {
      color: var(--brand);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .error {
      margin: 0;
      min-height: 18px;
      color: var(--danger);
      font-size: 12px;
    }

    /* APP */

    .private-view {
      min-height: 100dvh;
      padding-bottom: calc(72px + var(--safe-bottom));
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: calc(58px + var(--safe-top));
      padding:
        var(--safe-top)
        18px
        0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(247,247,245,.96);
      border-bottom: 1px solid rgba(229,231,230,.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand-inline {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }

    .brand-inline img {
      width: 29px;
      height: 29px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-inline strong {
      font-size: 13px;
      line-height: 1;
      letter-spacing: -.015em;
      font-weight: 760;
      white-space: nowrap;
    }

    .avatar-wrap {
      position: relative;
    }

    .avatar-button {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #FFF;
      color: var(--brand);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
    }

    .avatar-menu {
      position: absolute;
      right: 0;
      top: 40px;
      width: 150px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #FFF;
      box-shadow: 0 12px 32px rgba(20,26,28,.10);
    }

    .avatar-menu button {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 0 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .avatar-menu button:active {
      background: var(--surface-2);
    }

    .page {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 18px 16px 26px;
    }

    .hello-block {
      margin-bottom: 20px;
    }

    .hello-block h1 {
      margin: 0;
      font-size: 29px;
      line-height: 1.08;
      letter-spacing: -.045em;
      font-weight: 760;
    }

    .today {
      margin: 6px 0 0;
      color: var(--text-2);
      font-size: 13px;
    }

    #userMeta {
      display: none !important;
    }

    .section-head {
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-head h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: -.01em;
      font-weight: 720;
    }

    .section-note {
      color: var(--text-3);
      font-size: 11px;
    }

    .content-panel {
      animation: fade-in .14s ease;
    }

    @keyframes fade-in {
      from { opacity: .45; transform: translateY(1px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* COMPACT DATA LISTS */

    .card-list {
      display: grid;
      gap: 8px;
    }

    .content-card {
      margin: 0;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      min-width: 0;
    }

    .content-card h4 {
      margin: 4px 0 0;
      font-size: 14px;
      line-height: 1.28;
      font-weight: 720;
      letter-spacing: -.01em;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    .content-card p {
      margin: 5px 0 0;
      color: var(--text-2);
      font-size: 12px;
      line-height: 1.35;
    }

    .content-card a {
      display: inline-flex;
      margin-top: 3px;
      font-size: 12px;
      font-weight: 650;
    }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--text-3);
      font-size: 10.5px;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 19px;
      padding: 2px 7px;
      border-radius: 7px;
      background: #F0F2F1;
      color: #717678;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: none;
      white-space: nowrap;
    }

    .card-meta {
      color: var(--text-2);
    }

    /* AGENDA: APPEAR AS ROWS */

    #agendaList {
      border-top: 1px solid var(--line);
      gap: 0;
    }

    #agendaList .content-card {
      position: relative;
      padding: 13px 0 13px 74px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      min-height: 64px;
    }

    #agendaList .card-topline {
      position: static;
      min-height: 0;
    }

    #agendaList .card-topline > span:first-child {
      position: absolute;
      left: 0;
      top: 14px;
      width: 58px;
      color: var(--brand);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .015em;
      line-height: 1.3;
      text-transform: uppercase;
      white-space: normal;
    }

    #agendaList .card-topline .pill {
      margin-left: auto;
    }

    #agendaList h4 {
      margin-top: 2px;
      padding-right: 4px;
      font-size: 14px;
      line-height: 1.25;
      display: block;
    }

    #agendaList .card-meta {
      display: inline;
      margin-right: 5px;
    }

    #agendaList .card-meta + .card-meta::before {
      content: " · ";
      color: var(--text-3);
    }

    #agendaList .content-card > p:not(.card-meta) {
      margin-top: 5px;
    }

    /* SEARCH */

    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-3);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 12px 0 37px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #FFF;
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    .search-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(30,119,135,.08);
    }

    /* SKELETON */

    .content-card.loading-card {
      min-height: 58px;
      border-color: transparent;
      background:
        linear-gradient(
          90deg,
          #EFEFED 25%,
          #F7F7F5 37%,
          #EFEFED 63%
        );
      background-size: 400% 100%;
      animation: skeleton 1.2s ease infinite;
    }

    @keyframes skeleton {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 70;
      height: calc(58px + var(--safe-bottom));
      padding: 0 8px var(--safe-bottom);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(250,250,248,.98);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .tab {
      position: relative;
      height: 58px;
      padding: 6px 4px 5px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #6F7476;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      line-height: 1;
      font-weight: 620;
      cursor: pointer;
    }

    .tab svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.75;
    }

    .tab.active {
      color: var(--brand);
    }

    .tab.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 28px;
      height: 2px;
      border-radius: 0 0 2px 2px;
      background: var(--brand);
      transform: translateX(-50%);
    }




    /* ZONA DE INVITADOS */
    .guest-view {
      min-height: 100dvh;
      background: var(--bg);
      padding-bottom: calc(86px + env(safe-area-inset-bottom));
    }

    .guest-header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 62px;
      padding: max(10px, env(safe-area-inset-top)) 18px 10px;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .guest-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .guest-brand img {
      width: 27px;
      height: 27px;
      object-fit: contain;
      border-radius: 7px;
    }

    .guest-brand strong {
      color: var(--text);
      font-size: 13px;
      letter-spacing: .04em;
    }

    .guest-exit {
      border: 0;
      background: transparent;
      color: var(--brand);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 0 8px 12px;
      cursor: pointer;
    }

    .guest-page {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 22px 16px 12px;
    }

    .guest-intro {
      margin-bottom: 20px;
    }

    .guest-intro h1 {
      margin: 0 0 5px;
      color: var(--text);
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .guest-intro p {
      margin: 0;
      color: var(--text-2);
      font-size: 13px;
      line-height: 1.5;
    }

    .guest-panel.hidden {
      display: none;
    }

    .guest-card {
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0,0,0,.025);
    }

    .guest-card-main {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 14px;
      padding: 15px 15px 13px;
    }

    .guest-date {
      display: grid;
      align-content: start;
      justify-items: center;
      min-height: 58px;
      padding: 8px 4px;
      border-radius: 11px;
      background: var(--bg);
    }

    .guest-date small {
      color: var(--text-3);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .guest-date strong {
      margin-top: 1px;
      color: var(--brand);
      font-size: 23px;
      line-height: 1;
    }

    .guest-date span {
      margin-top: 2px;
      color: var(--text-2);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .guest-card-copy h3 {
      margin: 0 0 5px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: -.012em;
    }

    .guest-card-copy p {
      margin: 2px 0 0;
      color: var(--text-2);
      font-size: 11.5px;
      line-height: 1.4;
    }

    .guest-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .guest-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--line);
    }

    .guest-action {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 11.5px;
      font-weight: 730;
      cursor: pointer;
    }

    .guest-action.primary {
      border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
      background: color-mix(in srgb, var(--brand) 7%, var(--surface));
      color: var(--brand);
    }

    .guest-action:disabled {
      color: var(--text-3);
      background: var(--bg);
      cursor: default;
    }

    .guest-bottom-nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      min-height: calc(64px + env(safe-area-inset-bottom));
      padding: 5px max(14px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px, env(safe-area-inset-left));
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .guest-tab {
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: var(--text-3);
      font: inherit;
      font-size: 10px;
      font-weight: 650;
      cursor: pointer;
    }

    .guest-tab svg {
      width: 18px;
      height: 18px;
    }

    .guest-tab.active {
      color: var(--brand);
    }

    .guest-plancha {
      padding: 15px;
    }

    .guest-plancha h3 {
      margin: 0 0 4px;
      color: var(--text);
      font-size: 15px;
    }

    .guest-plancha p {
      margin: 0;
      color: var(--text-2);
      font-size: 12px;
    }

    .guest-plancha a {
      display: inline-block;
      margin-top: 12px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 740;
      text-decoration: none;
    }

    .guest-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      align-items: end;
      background: rgba(19, 25, 24, .35);
      padding: 20px 12px max(12px, env(safe-area-inset-bottom));
    }

    .guest-modal.hidden {
      display: none;
    }

    .guest-modal-card {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 18px;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(0,0,0,.16);
    }

    .guest-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .guest-modal-head h2 {
      margin: 0;
      color: var(--text);
      font-size: 18px;
    }

    .guest-modal-close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: var(--bg);
      color: var(--text-2);
      font-size: 20px;
      line-height: 1;
    }

    .guest-form {
      display: grid;
      gap: 12px;
    }

    .guest-form label {
      display: grid;
      gap: 6px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
    }

    .guest-form input {
      min-height: 44px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      padding: 0 12px;
      outline: none;
    }

    .guest-form input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent);
    }

    .guest-form-submit {
      min-height: 44px;
      margin-top: 2px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: white;
      font: inherit;
      font-size: 13px;
      font-weight: 760;
      cursor: pointer;
    }

    .guest-form-status {
      min-height: 17px;
      margin: 0;
      color: var(--text-3);
      font-size: 11px;
      line-height: 1.4;
    }

    @media (min-width: 700px) {
      .guest-card-main {
        grid-template-columns: 72px 1fr;
      }

      .guest-modal {
        align-items: center;
      }
    }


    /* INTERN0 + HISTÓRICO + ASISTENCIA */
    .internal-block {
      margin-top: 22px;
    }

    .internal-block:first-of-type {
      margin-top: 8px;
    }

    .internal-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 9px;
    }

    .internal-block-head h3,
    .agenda-history-title {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: -.012em;
    }

    .internal-empty p {
      margin: 0;
      color: var(--text-3);
      font-size: 12px;
    }

    .agenda-history {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .agenda-history-title {
      margin-bottom: 10px;
      color: var(--text-2);
    }

    #agendaList .content-card.tenida-card.tenida-past {
      background: #F1F2F1;
      border-color: #E1E3E2;
    }

    #agendaList .content-card.tenida-card.tenida-past .tenida-date {
      color: #7B8280;
    }

    #agendaList .content-card.tenida-card.tenida-past .tenida-date strong,
    #agendaList .content-card.tenida-card.tenida-past .tenida-copy h4 {
      color: #555B59;
    }

    (function () {

        { id:'EVT-6026-002', date:'2026-10-10', title:'Tenida Ordinaria', type:'Comp.·.', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-003', date:'2026-11-14', title:'Tenida Ordinaria', type:'M.·.', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-004', date:'2026-12-19', title:'Tenida Solsticial', type:'', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-005', date:'2027-01-09', title:'Tenida Ordinaria', type:'Comp.·.', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-006', date:'2027-02-13', title:'Tenida Ordinaria', type:'M.·.', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-007', date:'2027-03-13', title:'Tenida Ordinaria', type:'Comp.·.', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-008', date:'2027-04-10', title:'Tenida Ordinaria', type:'M.·.', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-009', date:'2027-05-08', title:'Tenida Ordinaria', type:'Comp.·.', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' },
        { id:'EVT-6026-010', date:'2027-06-19', title:'Tenida Solsticial', type:'', time:'', place:'Oriente de Vitoria-Gasteiz', convocatoria:'' }
      ];

      const guestPapers = [
        {
          title: 'La Piedra Rechazada',
          author: 'Raquel',
          url: 'https://drive.google.com/file/d/1vFwsZv3KmmvTmlI7CN4Ff3sjtXqi32zN/preview'
        },
        {
          title: 'La Libertad contra la Realidad',
          author: 'Eric',
          url: 'https://drive.google.com/file/d/1KD-0ZnF9ggoNFWZRuCDjJOjcvMTj5v9s/preview'
        }
      ];

      const gMonths = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      const gWeekdays = ['dom','lun','mar','mié','jue','vie','sáb'];

      function guestEscape(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function gDate(value) {
        const [y,m,d] = String(value).split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function guestCanOpen(item) {
        const date = gDate(item.date);
        if (!date || Number.isNaN(date.getTime())) return false;

        const today = new Date();
        today.setHours(0,0,0,0);
        date.setHours(0,0,0,0);

        if (date < today) return true;

        const diffDays = Math.ceil((date - today) / 86400000);
        return diffDays <= 15 || Boolean(item.convocatoria);
      }

      function renderGuestCalendar() {
        const host = document.getElementById('guestCalendarList');
        if (!host) return;

        host.innerHTML = guestDates.map((item, index) => {
          const d = gDate(item.date);
          const canOpen = guestCanOpen(item);
          const classes = `guest-card${canOpen ? ' calendar-openable' : ' calendar-card-disabled'}`;
          const attrs = canOpen
            ? `role="button" tabindex="0" data-guest-open="${index}" aria-label="Abrir ${guestEscape(item.title)}"`
            : `aria-label="${guestEscape(item.title)}"`;

          return `
            <article class="${classes}" ${attrs}>
              <div class="guest-card-main">
                <div class="guest-date">
                  <small>${gWeekdays[d.getDay()]}</small>
                  <strong>${d.getDate()}</strong>
                  <span>${gMonths[d.getMonth()]}</span>
                </div>
                <div class="guest-card-copy">
                  <h3>${guestEscape(item.title)}</h3>
                  ${item.time ? `<p>${guestEscape(item.time)} · ${guestEscape(item.place)}</p>` : `<p>${guestEscape(item.place)}</p>`}
                  ${item.type ? `<div class="guest-tags"><span class="mini-tag">${guestEscape(item.type)}</span></div>` : ''}
                </div>
              </div>

              ${canOpen ? `
                <svg class="calendar-card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"></path>
                </svg>
              ` : ''}
            </article>
          `;
        }).join('');
      }


      function renderGuestTenidaDetail(item) {
        const d = gDate(item.date);
        const readableDate = new Intl.DateTimeFormat('es-ES', {
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }).format(d);

        const papers = item.id === 'EVT-6026-001' ? guestPapers : [];

        return `
          <div class="guest-detail-hero">
            <span class="detail-kicker">Tenida</span>
            <h2>${guestEscape(item.title)}</h2>
            <p>${guestEscape(readableDate)}</p>
            ${item.time ? `<p>${guestEscape(item.time)} · ${guestEscape(item.place)}</p>` : `<p>${guestEscape(item.place)}</p>`}
            ${item.type ? `<div class="guest-tags"><span class="mini-tag">${guestEscape(item.type)}</span></div>` : ''}

            <div class="guest-detail-actions">
              ${item.convocatoria
                ? `<button class="guest-action" type="button" onclick="window.open('${guestEscape(item.convocatoria)}','_blank','noopener')">Ver convocatoria</button>`
                : `<button class="guest-action" type="button" disabled>Convocatoria próximamente</button>`
              }
              <button class="guest-action primary" type="button"
                data-guest-signup
                data-id="${guestEscape(item.id)}"
                data-date="${guestEscape(item.date)}"
                data-title="${guestEscape(item.title)}">
                Apuntarse
              </button>
            </div>
          </div>

          ${papers.length ? `
            <section class="detail-section">
              <h3>Planchas</h3>
              <div class="detail-paper-list">
                ${papers.map(p => `
                  <article class="detail-paper-card">
                    <div class="detail-paper-copy">
                      <h4>${guestEscape(p.title)}</h4>
                      <p>${guestEscape(p.author)}</p>
                    </div>
                    ${p.url ? `<a class="detail-paper-link" href="${guestEscape(p.url)}" target="_blank" rel="noopener noreferrer">Abrir PDF</a>` : ''}
                  </article>
                `).join('')}
              </div>
            </section>
          ` : ''}
        `;
      }

      function openGuestTenida(index) {
        const item = guestDates[index];
        if (!item || !guestCanOpen(item)) return;

        document.getElementById('guestCalendarPanel')?.classList.add('hidden');
        document.getElementById('guestPapersPanel')?.classList.add('hidden');

        const panel = document.getElementById('guestTenidaDetailPanel');
        const content = document.getElementById('guestTenidaDetailContent');
        if (!panel || !content) return;

        content.innerHTML = renderGuestTenidaDetail(item);
        panel.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function backGuestCalendar() {
        document.getElementById('guestTenidaDetailPanel')?.classList.add('hidden');
        document.getElementById('guestCalendarPanel')?.classList.remove('hidden');

        document.querySelectorAll('.guest-tab').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.guestView === 'calendar');
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderGuestPapers() {
        const host = document.getElementById('guestPapersList');
        if (!host) return;

        if (!guestPapers.length) {
          host.innerHTML = '<article class="guest-card guest-plancha"><p>No hay planchas públicas disponibles.</p></article>';
          return;
        }

        host.innerHTML = guestPapers.map(p => `
          <article class="guest-card guest-plancha">
            <h3>${guestEscape(p.title)}</h3>
            <p>${guestEscape(p.author)}</p>
            ${p.url ? `<a href="${guestEscape(p.url)}" target="_blank" rel="noopener noreferrer">Abrir plancha →</a>` : ''}
          </article>
        `).join('');
      }

      function showGuest() {
        document.getElementById('loginView')?.classList.add('hidden');
        document.getElementById('privateView')?.classList.add('hidden');
        document.getElementById('guestView')?.classList.remove('hidden');
        document.body.style.overflow = '';
        renderGuestCalendar();
        renderGuestPapers();
        window.scrollTo(0, 0);
      }

      function exitGuest() {
        document.getElementById('guestView')?.classList.add('hidden');
        document.getElementById('loginView')?.classList.remove('hidden');
        history.replaceState(null, '', location.pathname + location.search);
        window.scrollTo(0, 0);
      }

      function openSignup(button) {
        const modal = document.getElementById('guestSignupModal');
        if (!modal) return;

        document.getElementById('guestTenidaId').value = button.dataset.id || '';
        document.getElementById('guestTenidaDate').value = button.dataset.date || '';
        document.getElementById('guestTenidaTitle').value = button.dataset.title || '';
        document.getElementById('guestSignupTenida').textContent =
          `${button.dataset.title || 'Tenida'} · ${button.dataset.date || ''}`;
        document.getElementById('guestSignupStatus').textContent = '';
        modal.classList.remove('hidden');
        document.getElementById('guestName')?.focus();
      }

      function closeSignup() {
        document.getElementById('guestSignupModal')?.classList.add('hidden');
      }

      document.getElementById('guestEntryLink')?.addEventListener('click', event => {
        event.preventDefault();
        history.replaceState(null, '', '#invitado');
        showGuest();
      });

      document.getElementById('guestExitButton')?.addEventListener('click', exitGuest);
      document.getElementById('guestSignupClose')?.addEventListener('click', closeSignup);

      document.getElementById('guestSignupModal')?.addEventListener('click', event => {
        if (event.target.id === 'guestSignupModal') closeSignup();
      });

      document.addEventListener('click', event => {
        const signup = event.target.closest('[data-guest-signup]');
        if (signup) {
          event.stopPropagation();
          openSignup(signup);
          return;
        }

        const opener = event.target.closest('[data-guest-open]');
        if (opener) {
          openGuestTenida(Number(opener.dataset.guestOpen));
        }
      });

      document.addEventListener('keydown', event => {
        const opener = event.target.closest?.('[data-guest-open]');
        if (!opener) return;
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openGuestTenida(Number(opener.dataset.guestOpen));
        }
      });

      document.getElementById('guestDetailBack')?.addEventListener('click', backGuestCalendar);

      document.querySelectorAll('.guest-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const view = tab.dataset.guestView;
          document.querySelectorAll('.guest-tab').forEach(t => t.classList.toggle('active', t === tab));
          document.getElementById('guestTenidaDetailPanel')?.classList.add('hidden');
          document.getElementById('guestCalendarPanel')?.classList.toggle('hidden', view !== 'calendar');
          document.getElementById('guestPapersPanel')?.classList.toggle('hidden', view !== 'papers');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      document.getElementById('guestSignupForm')?.addEventListener('submit', async event => {
        event.preventDefault();

        const status = document.getElementById('guestSignupStatus');
        const submit = event.currentTarget.querySelector('button[type="submit"]');

        const payload = {
          action: 'guest_signup',
          tenidaId: document.getElementById('guestTenidaId').value,
          fechaTenida: document.getElementById('guestTenidaDate').value,
          tenida: document.getElementById('guestTenidaTitle').value,
          nombre: document.getElementById('guestName').value.trim(),
          logia: document.getElementById('guestLodge').value.trim()
        };

        if (!payload.nombre || !payload.logia) return;

        submit.disabled = true;
        status.textContent = 'Enviando…';

        try {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();

          if (!data.ok) throw new Error(data.error || 'No se pudo registrar la inscripción.');

          status.textContent = 'Inscripción registrada.';
          event.currentTarget.reset();

          setTimeout(closeSignup, 900);

        } catch (error) {
          status.textContent = error.message || 'No se pudo registrar la inscripción.';
        } finally {
          submit.disabled = false;
        }
      });

      if (location.hash === '#invitado') {
        showGuest();
      }
    })();
  
      function normalizeRoleLabel(value) {
        return String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();
      }

      function configureRolePanels(user) {
        const username = normalizeRoleLabel(user?.Usuario || user?.usuario || user?.username || '');
        const displayName = normalizeRoleLabel(user?.['Nombre mostrado'] || user?.nombre || user?.name || '');
        const role = normalizeRoleLabel(user?.Rol || user?.rol || user?.role || '');

        const isSecretary =
          username === 'manu' ||
          displayName === 'manu' ||
          role.includes('secretar');

        const isMaster =
          username === 'fernando' ||
          displayName === 'fernando' ||
          role.includes('venerable');

        const secretaryNav = document.getElementById('secretaryNavItem');
        const masterNav = document.getElementById('masterNavItem');

        if (secretaryNav) secretaryNav.hidden = !isSecretary;
        if (masterNav) masterNav.hidden = !isMaster;

        document.body.dataset.isSecretary = isSecretary ? '1' : '0';
        document.body.dataset.isMaster = isMaster ? '1' : '0';
      }

      function openRoleShortcut(view) {
        const target = document.querySelector(`[data-view="${view}"]`);
        if (target && typeof target.click === 'function') {
          target.click();
        }
      }

      function bindRoleNav() {
        async function openManagementPanel(panelId, navId) {
          document.querySelectorAll('.content-panel, .view-panel')
            .forEach(el => el.classList.add('hidden'));

          document.querySelectorAll('.bottom-nav .tab, .bottom-nav .role-nav-item')
            .forEach(el => el.classList.remove('active'));

          document.getElementById(panelId)?.classList.remove('hidden');
          document.getElementById(navId)?.classList.add('active');

          const token = localStorage.getItem(TOKEN_KEY);

          if (token && !managementData && !managementLoadPromise) {
            managementLoadPromise = loadManagementData(token)
              .finally(() => { managementLoadPromise = null; });
          }

          if (managementLoadPromise) {
            // El panel ya está visible; no bloqueamos la navegación esperando la red.
            managementLoadPromise.catch(() => {});
          }
        }

        document.getElementById('secretaryNavItem')?.addEventListener('click', () => {
          openManagementPanel('secretaryPanel', 'secretaryNavItem');
        });

        document.getElementById('masterNavItem')?.addEventListener('click', () => {
          openManagementPanel('masterPanel', 'masterNavItem');
        });
      }

      document.addEventListener('DOMContentLoaded', bindRoleNav);

  </script>

            const cached = localStorage.getItem('europa110_agenda_html');
            if (cached) {
              agenda.innerHTML = cached;
            } else {
              agenda.innerHTML =
                '<article class="content-card"><p>Actualizando agenda…</p></article>';
            }
            agenda.dataset.fastBoot = '1';
          }
        } catch (_) {}
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', revealShellFast);
      } else {
        revealShellFast();
      }
    })();
  </script>

  <script src="config.js?v=20260911-lean5"></script>
  <script src="app.js?v=20260911-lean5"></script>

  <script>
    /*
      Agenda por tarjetas con ficha interna.
      La API, autenticación, permisos y Google Sheets permanecen intactos.
    */

    (function () {
      const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      const weekdays = ['dom','lun','mar','mié','jue','vie','sáb'];

      const TENIDA_DETAILS = {
        '2026-09-12': {
          number: '022',
          subtitle: 'Tenida de Instalación',
          degree: 'A.•.',
          presence: '16:00',
          start: '17:00',
          place: 'Oriente de Vitoria-Gasteiz',
          source: 'Convocatoria oficial recibida por correo',
          order: [
            'Apertura de los Trabajos en A.•. según el R.·. F.·. dR.·.: reconocimiento masónico, recuerdo de los Principios Capitales de la G.·. L.·. S.·. E.·. y apertura propiamente dicha.',
            'Lectura del acta de los anteriores Trabajos y de correspondencia: llamada nominal, adopción del trazado de los últimos Trabajos y lectura de la correspondencia.',
            'Introducción de visitantes y dignatarios de la Orden.',
            'Instalación del V.·. M.·. electo, Q.·. H.·. Fernando, por el V.·. M.·. saliente, Q.·. H.·. Jesús Campo.',
            'Instalación del Colegio de Oficiales de la R.·. L.·. Europa para el curso masónico 6026–6027 por el V.·. M.·. instalado.',
            'Información sobre la traducción literal al español del Ritual del G.·. O.·. D.·. F.·. 6018 y su presentación al GCGDE a finales de septiembre de 6026.',
            'Breve informe de tesorería por el Q.·. H.·. Tesorero Manu Carretero. El resto de OO.·. presentará sus informes en la tenida del 10 de octubre.',
            'Informe de la llamada a puertas de los profanos Santiago C. y Pablo Alfonso B. y votación, si procede, para continuar con el proceso de aplomaciones.',
            'Lectura de planchas e instrucción de grado.',
            'Cadena de Unión.',
            'Circulación del Tronco de la Viuda y del Saco de Proposiciones.',
            'Cierre de los Trabajos según el R.·. F.·. dR.·.'
          ],
          papers: [
            { title: 'La Piedra Rechazada', author: 'Raquel', url: 'https://drive.google.com/file/d/1vFwsZv3KmmvTmlI7CN4Ff3sjtXqi32zN/preview' },
            { title: 'La Libertad contra la Realidad', author: 'Eric', url: 'https://drive.google.com/file/d/1KD-0ZnF9ggoNFWZRuCDjJOjcvMTj5v9s/preview' }
          ]
        }
      };

      let agendaItems = [];

      function tenidaDisplayTitle(item, extra) {
        if (extra?.subtitle) return extra.subtitle;

        const current = String(item?.['Título'] || '').trim();
        if (current) return current;

        const type = String(item?.['Tipo'] || '').trim().toLowerCase();

        if (type.includes('solst')) return 'Tenida Solsticial';
        if (type.includes('instal')) return 'Tenida de Instalación';

        return 'Tenida Ordinaria';
      }

      function isPastTenida(value) {
        const date = parseDate(value);
        if (!date) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        date.setHours(0, 0, 0, 0);
        return date < today;
      }

      function tenidaCanOpen(item, extra) {
        const date = parseDate(item?.['Fecha'] || '');
        if (!date) return false;

        const today = new Date();
        today.setHours(0,0,0,0);
        date.setHours(0,0,0,0);

        if (date < today) return true;

        const diffDays = Math.ceil((date - today) / 86400000);
        const hasConvocatoria = Boolean(
          extra?.convocatoria ||
          item?.['Enlace / archivo'] ||
          item?.['Convocatoria']
        );

        return diffDays <= 15 || hasConvocatoria;
      }

      function attendanceIsOpen(value) {
        const date = parseDate(value);
        if (!date) return false;

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        date.setHours(0, 0, 0, 0);

        const diffDays = Math.ceil((date - today) / 86400000);
        return diffDays >= 0 && diffDays <= 10;
      }


      function parseDate(value) {
        const raw = String(value || '').trim();
        if (!raw) return null;

        const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) {
          return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
        }

        const dmy = raw.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
        if (dmy) {
          return new Date(Number(dmy[3]), Number(dmy[2]) - 1, Number(dmy[1]));
        }

        const d = new Date(raw);
        return Number.isNaN(d.getTime()) ? null : d;
      }

      function isoKey(value) {
        const d = parseDate(value);
        if (!d) return '';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function humanCardDate(value) {
        const d = parseDate(value);
        if (!d) return { wd: '', day: String(value || ''), mon: '' };

        return {
          wd: weekdays[d.getDay()],
          day: String(d.getDate()),
          mon: months[d.getMonth()]
        };
      }

      function humanLongDate(value) {
        const d = parseDate(value);
        if (!d) return String(value || '');

        return new Intl.DateTimeFormat('es-ES', {
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }).format(d);
      }

      function setToday() {
        const el = document.getElementById('todayText');
        if (!el) return;

        let text = new Intl.DateTimeFormat('es-ES', {
          weekday: 'long',
          day: 'numeric',
          month: 'long'
        }).format(new Date());

        el.textContent = text.charAt(0).toUpperCase() + text.slice(1);
      }

      function adaptWelcome() {
        const welcome = document.getElementById('welcomeName');
        const avatar = document.getElementById('avatarButton');
        if (!welcome) return;

        const update = () => {
          const raw = welcome.textContent.trim();

          if (raw.startsWith('Bienvenido,')) {
            const name = raw.replace('Bienvenido,', '').trim();
            welcome.textContent = name ? `Hola, ${name}` : 'Hola';
            if (avatar && name) avatar.textContent = name.charAt(0).toUpperCase();
          } else if (raw === 'Bienvenido') {
            welcome.textContent = 'Hola';
          }
        };

        new MutationObserver(update).observe(welcome, {
          childList: true,
          subtree: true,
          characterData: true
        });

        update();
      }

      function setupAvatarMenu() {
        const button = document.getElementById('avatarButton');
        const menu = document.getElementById('avatarMenu');

        if (!button || !menu) return;

        button.addEventListener('click', event => {
          event.stopPropagation();
          const open = !menu.classList.contains('hidden');
          menu.classList.toggle('hidden', open);
          button.setAttribute('aria-expanded', String(!open));
        });

        document.addEventListener('click', event => {
          if (
            !menu.classList.contains('hidden') &&
            !menu.contains(event.target) &&
            event.target !== button
          ) {
            menu.classList.add('hidden');
            button.setAttribute('aria-expanded', 'false');
          }
        });
      }

      function showMainShell() {
        document.querySelector('.hello-block')?.classList.remove('hidden');
        document.getElementById('tenidaDetailView')?.classList.add('hidden');
      }

      function openTenidaDetail(index) {
        const item = agendaItems[index];
        if (!item) return;

        const detailView = document.getElementById('tenidaDetailView');
        const detailContent = document.getElementById('tenidaDetailContent');
        if (!detailView || !detailContent) return;

        document.querySelector('.hello-block')?.classList.add('hidden');
        document.querySelectorAll('.content-panel').forEach(panel => panel.classList.add('hidden'));

        detailContent.innerHTML = renderTenidaDetail(item);

        if (currentUserIsManagement() && !managementData && !managementLoadPromise) {
          const token = localStorage.getItem(TOKEN_KEY);
          if (token) {
            managementLoadPromise = loadManagementData(token)
              .then(() => {
                if (detailView && !detailView.classList.contains('hidden')) {
                  detailContent.innerHTML = renderTenidaDetail(item);
                }
              })
              .finally(() => { managementLoadPromise = null; });
          }
        }
        detailView.classList.remove('hidden');

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function backToAgenda() {
        document.getElementById('tenidaDetailView')?.classList.add('hidden');
        document.querySelector('.hello-block')?.classList.remove('hidden');
        document.getElementById('agendaPanel')?.classList.remove('hidden');

        document.querySelectorAll('.tab').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.view === 'agenda');
        });
      }

      window.openTenidaDetail = openTenidaDetail;

      const originalSetupTabs = setupTabs;
      setupTabs = function() {
        originalSetupTabs();

        document.querySelectorAll('.tab').forEach(tab => {
          tab.addEventListener('click', () => showMainShell());
        });
      };

      loadAgenda = async function(token) {
        try {
          const cachedAgenda = localStorage.getItem('europa110_agenda_html');
          if (cachedAgenda && !agendaList.innerHTML.trim()) {
            agendaList.innerHTML = cachedAgenda;
          }
        } catch (_) {}

        try {
          const result = await apiGet('agenda', token);

          if (!result.ok) {
            throw new Error(result.error);
          }

          agendaItems = result.items || [];

          if (!agendaItems.length) {
            agendaList.innerHTML = emptyCard('No hay citas visibles.');
            return;
          }

          const indexed = agendaItems.map((item, index) => ({ item, index }));

          const future = indexed
            .filter(entry => !isPastTenida(entry.item['Fecha'] || ''))
            .sort((a, b) => (parseDate(a.item['Fecha']) || 0) - (parseDate(b.item['Fecha']) || 0));

          const past = indexed
            .filter(entry => isPastTenida(entry.item['Fecha'] || ''))
            .sort((a, b) => (parseDate(b.item['Fecha']) || 0) - (parseDate(a.item['Fecha']) || 0));

          let html = future
            .map(entry => renderAgendaItem(entry.item, entry.index, false))
            .join('');

          if (!future.length) {
            html += emptyCard('No hay próximas tenidas.');
          }

          if (past.length) {
            html += `
              <section class="agenda-history">
                <h3 class="agenda-history-title">Tenidas anteriores</h3>
                ${past.map(entry => renderAgendaItem(entry.item, entry.index, true)).join('')}
              </section>
            `;
          }

          agendaList.innerHTML = html;
          try {
            localStorage.setItem('europa110_agenda_html', html);
          } catch (_) {}

        } catch (error) {
          agendaList.innerHTML = errorCard(error.message);
        }
      };

      renderAgendaItem = function(item, index, isPast = false) {
        const d = humanCardDate(item['Fecha'] || '');
        const key = isoKey(item['Fecha'] || '');
        const extra = TENIDA_DETAILS[key];

        const title = escapeHtml(tenidaDisplayTitle(item, extra));
        const canOpen = tenidaCanOpen(item, extra);
        const time = escapeHtml(extra?.start || item['Hora'] || '');
        const place = escapeHtml(extra?.place || item['Lugar'] || '');
        const type = escapeHtml(item['Tipo'] || '');
        const degree = escapeHtml(extra?.degree || '');
        const meta = [time, place].filter(Boolean).join(' · ');
        const attendanceValue = String(item['Mi asistencia'] || '').trim();
        const showAttendance = attendanceIsOpen(item['Fecha'] || '') || isPast;
        const attendanceClass = attendanceValue === 'Sí'
          ? 'yes'
          : attendanceValue === 'No'
            ? 'no'
            : 'pending';
        const attendanceText = attendanceValue === 'Sí'
          ? 'Asistencia confirmada'
          : attendanceValue === 'No'
            ? 'No asistiré'
            : 'No confirmado';

        const classes = [
          'guest-card',
          'member-agenda-card',
          isPast ? 'tenida-past' : '',
          canOpen ? '' : 'calendar-card-disabled'
        ].filter(Boolean).join(' ');

        const attrs = canOpen
          ? `role="button" tabindex="0" onclick="openTenidaDetail(${index})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTenidaDetail(${index});}" aria-label="Abrir ${title}"`
          : `aria-label="${title}"`;

        return `
          <article class="${classes}" ${attrs}>
            <div class="guest-card-main">
              <div class="guest-date">
                <small>${escapeHtml(d.wd)}</small>
                <strong>${escapeHtml(d.day)}</strong>
                <span>${escapeHtml(d.mon)}</span>
              </div>

              <div class="guest-card-copy">
                <h3>${title}</h3>
                ${meta ? `<p>${meta}</p>` : ''}
                ${(degree || type) ? `
                  <div class="guest-tags">
                    ${degree ? `<span class="mini-tag">${degree}</span>` : ''}
                    ${type ? `<span class="mini-tag">${type}</span>` : ''}
                  </div>
                ` : ''}

                ${showAttendance ? `
                  <span class="attendance-agenda-status ${attendanceClass}">
                    ${attendanceText}
                  </span>
                ` : ''}
              </div>
            </div>

            ${canOpen ? `
              <svg class="calendar-card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            ` : ''}
          </article>
        `;
      };

      function iconClock() {
        return `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
        `;
      }

      function iconMap() {
        return `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
            <circle cx="12" cy="10" r="2.5"></circle>
          </svg>
        `;
      }

      function renderTenidaDetail(item) {
        const key = isoKey(item['Fecha'] || '');
        const extra = TENIDA_DETAILS[key];

        const title = escapeHtml(tenidaDisplayTitle(item, extra));
        const longDate = escapeHtml(humanLongDate(item['Fecha'] || ''));
        const timeStart = escapeHtml(extra?.start || item['Hora'] || '');
        const place = escapeHtml(extra?.place || item['Lugar'] || '');
        const degree = escapeHtml(extra?.degree || '');
        const type = escapeHtml(item['Tipo'] || '');
        const number = escapeHtml(extra?.number || '');

        let html = `
          <div class="detail-hero">
            <span class="detail-kicker">${number ? `Tenida nº ${number}` : 'Tenida'}</span>
            <h2>${title}</h2>

            <div class="tenida-tags" style="margin-top:10px">
              ${degree ? `<span class="mini-tag">${degree}</span>` : ''}
              ${type ? `<span class="mini-tag">${type}</span>` : ''}
            </div>

            <div class="detail-meta">
              <div class="detail-meta-row">
                ${iconClock()}
                <span>
                  ${longDate}
                  ${timeStart ? ` · ${timeStart}` : ''}
                  ${extra?.presence ? `<br>Libro de presencia: ${escapeHtml(extra.presence)}` : ''}
                </span>
              </div>

              ${place ? `
                <div class="detail-meta-row">
                  ${iconMap()}
                  <span>${place}</span>
                </div>
              ` : ''}
            </div>
          </div>
        `;

        if (attendanceIsOpen(item['Fecha'] || '')) {
          const tenidaId = escapeHtml(item['ID'] || key || '');
          html += `
            <section class="detail-section">
              <h3>Asistencia</h3>
              <div class="attendance-box">
                <p class="attendance-copy">Confirma si asistirás a esta tenida. Puedes cambiar tu respuesta después.</p>
                <div class="attendance-actions">
                  <button class="attendance-button${String(item['Mi asistencia'] || '').trim() === 'Sí' ? ' primary' : ''}" type="button" onclick="saveAttendance('${tenidaId}', 'Sí', this)">
                    Confirmo asistencia
                  </button>
                  <button class="attendance-button${String(item['Mi asistencia'] || '').trim() === 'No' ? ' attendance-no-selected' : ''}" type="button" onclick="saveAttendance('${tenidaId}', 'No', this)">
                    No asistiré
                  </button>
                </div>
                <p id="attendanceStatus" class="attendance-status"></p>
              </div>
            </section>
          `;
        }


        if (currentUserIsManagement()) {
          html += renderManagementAttendanceForTenida(item['ID'] || key || '');
        }

        if (extra?.order?.length) {
          html += `
            <section class="detail-section">
              <h3>Orden del día</h3>
              <ul>
                ${extra.order.map(point => `<li>${escapeHtml(point)}</li>`).join('')}
              </ul>
            </section>
          `;
        } else {
          const description = escapeHtml(item['Descripción'] || '');
          if (description) {
            html += `
              <section class="detail-section">
                <h3>Información</h3>
                <p style="margin:0;color:var(--text-2);font-size:12.5px;line-height:1.45">
                  ${description}
                </p>
              </section>
            `;
          }
        }

        if (extra?.papers?.length) {
          html += `
            <section class="detail-section">
              <h3>Planchas</h3>

              ${extra.papers.map(paper => `
                ${paper.url ? `<a class="paper-detail-card paper-detail-link" href="${escapeHtml(paper.url)}" target="_blank" rel="noopener noreferrer">` : `<div class="paper-detail-card">`}
                  <strong>${escapeHtml(paper.title)}</strong>
                  <span>${escapeHtml(paper.author)}</span>
                  ${paper.url ? `<span class="paper-open-action">Abrir PDF <span aria-hidden="true">→</span></span>` : ''}
                ${paper.url ? `</a>` : `</div>`}
              `).join('')}

              <div class="source-note" style="margin-top:10px">
                Estas dos planchas están disponibles en PDF y asociadas a esta tenida.
              </div>
            </section>
          `;
        }


        if (extra?.source) {
          html += `
            <section class="detail-section">
              <h3>Documentación</h3>
              <div class="source-note">
                ${escapeHtml(extra.source)}. El orden del día ha sido incorporado a esta ficha.
              </div>
            </section>
          `;
        }

        return html;
      }

      loadingCard = function() {
        return `
          <article class="content-card loading-card" aria-label="Cargando"></article>
          <article class="content-card loading-card" aria-hidden="true"></article>
          <article class="content-card loading-card" aria-hidden="true"></article>
        `;
      };


      window.saveAttendance = async function(tenidaId, response, button) {
        const status = document.getElementById('attendanceStatus');
        const buttons = document.querySelectorAll('.attendance-button');
        const token = localStorage.getItem('europa110_session') || '';

        buttons.forEach(btn => btn.disabled = true);
        if (status) status.textContent = 'Guardando…';

        try {
          const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'attendance',
              token,
              tenidaId,
              respuesta: response
            })
          });

          const data = await res.json();

          if (!data.ok) {
            throw new Error(data.error || 'No se pudo guardar la asistencia.');
          }

          if (status) {
            status.textContent = response === 'Sí'
              ? 'Asistencia confirmada.'
              : 'Ausencia registrada.';
          }

          buttons.forEach(btn => {
            btn.classList.remove('primary');
            btn.classList.remove('attendance-no-selected');
          });

          if (response === 'Sí') {
            button?.classList.add('primary');
          } else {
            button?.classList.add('attendance-no-selected');
          }

          const localItem = agendaItems.find(item =>
            String(item['ID'] || '').trim() === String(tenidaId || '').trim()
          );
          if (localItem) {
            localItem['Mi asistencia'] = response;
          }

          if (typeof renderAgenda === 'function') {
            renderAgenda();
          }

          if (currentUserIsManagement()) {
            await loadManagementData(token);
          }

        } catch (error) {
          if (status) status.textContent = error.message || 'No se pudo guardar la respuesta.';
        } finally {
          buttons.forEach(btn => btn.disabled = false);
        }
      };

      document.getElementById('tenidaBackButton')?.addEventListener('click', backToAgenda);

      setToday();
      adaptWelcome();
      setupAvatarMenu();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      });
    }
  
      let managementData = null;
      let managementLoadPromise = null;

      function currentUserIsManagement() {
        const username = normalizeRoleLabel(currentUser?.usuario || currentUser?.username || currentUser?.Usuario || '');
        const role = normalizeRoleLabel(currentUser?.rol || currentUser?.role || currentUser?.Rol || '');

        return (
          username === 'manu' ||
          username === 'fernando' ||
          role.includes('secretar') ||
          role.includes('venerable')
        );
      }

      function formatMoney(value) {
        const raw = String(value ?? '').trim().replace(/\./g, '').replace(',', '.');
        const number = Number(raw);
        if (!Number.isFinite(number)) return String(value || '—');
        return new Intl.NumberFormat('es-ES', {
          style: 'currency',
          currency: 'EUR',
          maximumFractionDigits: 2
        }).format(number);
      }

      function managementDate(value) {
        const d = parseDate(value || '');
        return d ? new Intl.DateTimeFormat('es-ES', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }).format(d) : String(value || '');
      }

      function renderAttendanceManagement(item) {
        const yes = item?.si || [];
        const no = item?.no || [];
        const pending = item?.pendientes || [];

        return `
          <article class="management-item">
            <h4>${escapeHtml(item?.titulo || 'Tenida')}</h4>
            <p>${escapeHtml(managementDate(item?.fecha || ''))}</p>

            <div class="attendance-summary-row">
              <span class="attendance-summary-pill yes">${yes.length} sí</span>
              <span class="attendance-summary-pill no">${no.length} no</span>
              <span class="attendance-summary-pill pending">${pending.length} sin confirmar</span>
            </div>

            <div class="management-names">
              <div><strong>Asisten</strong><span>${yes.length ? yes.map(escapeHtml).join(', ') : 'Nadie ha confirmado todavía'}</span></div>
              <div><strong>No asisten</strong><span>${no.length ? no.map(escapeHtml).join(', ') : '—'}</span></div>
              <div><strong>Pendientes</strong><span>${pending.length ? pending.map(escapeHtml).join(', ') : '—'}</span></div>
            </div>
          </article>
        `;
      }

      function renderManagementPanel(containerId, title) {
        const host = document.getElementById(containerId);
        if (!host) return;

        if (!managementData) {
          host.innerHTML = loadingCard();
          return;
        }

        const papers = managementData.unreadPapers || [];
        const attendance = (managementData.attendance || [])
          .slice()
          .sort((a, b) => (parseDate(a.fecha) || 0) - (parseDate(b.fecha) || 0));
        const tronco = (managementData.tronco || [])
          .slice()
          .sort((a, b) => (parseDate(b['Fecha tenida']) || 0) - (parseDate(a['Fecha tenida']) || 0));

        host.innerHTML = `
          <div class="role-panel-header">
            <h2>${escapeHtml(title)}</h2>
            <p>Seguimiento de planchas pendientes, asistencia y Tronco de la Viuda.</p>
          </div>

          <section class="management-section">
            <h3>Planchas sin leer</h3>
            <div class="management-list">
              ${papers.length ? papers.map(p => `
                <article class="management-item">
                  <h4>${escapeHtml(p['Título'] || 'Plancha')}</h4>
                  <p>${escapeHtml(p['Autor'] || '')}${p['Tema'] ? ` · ${escapeHtml(p['Tema'])}` : ''}</p>
                  ${p['Enlace / archivo'] ? `<a class="management-paper-link" href="${escapeHtml(p['Enlace / archivo'])}" target="_blank" rel="noopener noreferrer">Abrir plancha →</a>` : ''}
                  <p style="margin-top:8px">Pendiente de incluir en un próximo orden del día.</p>
                </article>
              `).join('') : `<div class="empty-card">No hay planchas pendientes de lectura.</div>`}
            </div>
          </section>

          <section class="management-section">
            <h3>Confirmaciones a las tenidas</h3>
            <div class="management-list">
              ${attendance.length ? attendance.map(renderAttendanceManagement).join('') : `<div class="empty-card">No hay tenidas disponibles.</div>`}
            </div>
          </section>

          <section class="management-section">
            <h3><svg class="section-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 6h8"></path>
              <path d="M9 6 8 3h8l-1 3"></path>
              <path d="M7 8c-2 2.2-3 5-3 8 0 3.2 2.4 5 8 5s8-1.8 8-5c0-3-1-5.8-3-8"></path>
              <path d="M12 17.2s-3-1.7-3-3.8c0-1 .7-1.8 1.7-1.8.6 0 1.1.3 1.3.8.2-.5.7-.8 1.3-.8 1 0 1.7.8 1.7 1.8 0 2.1-3 3.8-3 3.8Z"></path>
            </svg><span>Tronco de la Viuda</span></h3>
            <div class="management-list">
              ${tronco.length ? tronco.map(row => `
                <article class="management-item">
                  <h4>${escapeHtml(row.Tenida || 'Tenida')}</h4>
                  <p>${escapeHtml(managementDate(row['Fecha tenida'] || ''))}</p>
                  <div class="tronco-amount">${escapeHtml(formatMoney(row.Importe))}</div>
                </article>
              `).join('') : `<div class="empty-card">Todavía no hay importes registrados.</div>`}
            </div>
          </section>
        `;
      }

      async function loadManagementData(token) {
        if (!currentUserIsManagement()) {
          managementData = null;
          return;
        }

        try {
          const result = await apiGet('management', token);
          if (!result.ok) throw new Error(result.error || 'No se pudo cargar el panel.');

          managementData = result.data || {
            unreadPapers: [],
            attendance: [],
            tronco: []
          };

          renderManagementPanel('secretaryPanelContent', 'Panel del secretario');
          renderManagementPanel('masterPanelContent', 'Panel del Venerable Maestro');

        } catch (error) {
          managementData = null;
          const message = errorCard(error.message || 'No se pudo cargar el panel.');
          const secretary = document.getElementById('secretaryPanelContent');
          const master = document.getElementById('masterPanelContent');
          if (secretary) secretary.innerHTML = message;
          if (master) master.innerHTML = message;
        }
      }

      function renderManagementAttendanceForTenida(tenidaId) {
        if (!currentUserIsManagement() || !managementData) return '';

        const row = (managementData.attendance || [])
          .find(item => String(item.tenidaId || '') === String(tenidaId || ''));

        if (!row) return '';

        const yes = row.si || [];
        const no = row.no || [];
        const pending = row.pendientes || [];

        return `
          <section class="detail-section">
            <h3>Confirmaciones de la tenida</h3>
            <div class="management-detail-box">
              <div class="attendance-summary-row">
                <span class="attendance-summary-pill yes">${yes.length} sí</span>
                <span class="attendance-summary-pill no">${no.length} no</span>
                <span class="attendance-summary-pill pending">${pending.length} sin confirmar</span>
              </div>
              <div class="management-names">
                <div><strong>Asisten</strong><span>${yes.length ? yes.map(escapeHtml).join(', ') : '—'}</span></div>
                <div><strong>No asisten</strong><span>${no.length ? no.map(escapeHtml).join(', ') : '—'}</span></div>
                <div><strong>Pendientes</strong><span>${pending.length ? pending.map(escapeHtml).join(', ') : '—'}</span></div>
              </div>
            </div>
          </section>
        `;
      }

  
      // Entrada privada rápida: no espera a tres peticiones antes de mostrar la app.
      let lazyPlanchasLoaded = false;
      let lazyDocumentosLoaded = false;
      let lazyAgendaStarted = false;

      enterPrivateArea = async function(token) {
        configureRolePanels(currentUser);
        showPrivate();

        const displayName =
          currentUser?.name ||
          currentUser?.nombre ||
          currentUser?.['Nombre mostrado'] ||
          currentUser?.username ||
          currentUser?.usuario ||
          '';

        if (welcomeName) {
          welcomeName.textContent = displayName ? `Hola, ${displayName}` : 'Hola';
        }

        if (userMeta) {
          userMeta.textContent = '';
        }

        // La pantalla aparece ya. Agenda se carga sin bloquear el acceso.
        if (!lazyAgendaStarted) {
          lazyAgendaStarted = true;
          Promise.resolve(loadAgenda(token)).catch(() => {});
        }
      };

      function bindLazyPrivateSections() {
        const planchasTab = document.querySelector('.tab[data-view="planchas"]');
        const internoTab = document.querySelector('.tab[data-view="documentos"]');

        planchasTab?.addEventListener('click', () => {
          const token = localStorage.getItem(TOKEN_KEY);
          if (!token || lazyPlanchasLoaded) return;
          lazyPlanchasLoaded = true;
          Promise.resolve(loadPlanchas(token)).catch(() => {
            lazyPlanchasLoaded = false;
          });
        });

        internoTab?.addEventListener('click', () => {
          const token = localStorage.getItem(TOKEN_KEY);
          if (!token || lazyDocumentosLoaded) return;
          lazyDocumentosLoaded = true;
          Promise.resolve(loadDocumentos(token)).catch(() => {
            lazyDocumentosLoaded = false;
          });
        });
      }

      document.addEventListener('DOMContentLoaded', bindLazyPrivateSections);

  
      logoutButton?.addEventListener('click', () => {
        lazyPlanchasLoaded = false;
        lazyDocumentosLoaded = false;
        lazyAgendaStarted = false;
        managementData = null;
        managementLoadPromise = null;
      });

  </script>

</body>
</html>
